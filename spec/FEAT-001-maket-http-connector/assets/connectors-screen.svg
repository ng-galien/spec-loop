<text x="190" y="412" font-size="12" font-weight="normal" text-anchor="start" fill="#334155">The secret is never entered here: only the name of the environment variable is shown.</text>
<text x="190" y="432" font-size="12" font-weight="normal" text-anchor="start" fill="#334155">&quot;Test&quot; runs one list read with the configured secret, without changing any item.</text>
